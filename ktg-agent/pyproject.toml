[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ktg-agent"
version = "0.1.0"
description = "Python agent core for KTG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "pydantic-ai-slim[openai]==2.75.0",
    "pydantic-ai-harness==0.75.0",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.0.3",
    "types-jsonschema==4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.uv]
required-version = "==0.11.21"
