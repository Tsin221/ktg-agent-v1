[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ktg-agent"
version = "0.1.0"
description = "Python agent core for KTG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
analysis = ["pymysql==1.2.4", "sqlglot==30.33.0"]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.0.3",
    "types-jsonschema==4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.uv]
required-version = "==0.11.21"
